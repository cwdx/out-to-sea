# Builds the Mac app and publishes it as a GitHub release whenever the app's version (electrobun.config.ts) is one that
# has no release yet. The mirror commits here; this turns a version bump upstream into a download.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/out-to-sea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/.*version: "\([0-9][^"]*\)".*/\1/p' electrobun.config.ts | head -1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.version.outputs.new == 'true'
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: |
          bun install
          # the first Electrobun run fetches the devkit the views are built against
          mkdir -p dist && bunx electrobun build --env=stable || true
          bun run app
      - name: Publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp build/stable-macos-arm64/OutToSea-stable.dmg "OutToSea-$TAG-arm64.dmg"
          gh release create "$TAG" "OutToSea-$TAG-arm64.dmg" --repo "$GITHUB_REPOSITORY" --title "Out to Sea $TAG" --notes "Apple silicon. Not yet signed: see the README to open it the first time."
