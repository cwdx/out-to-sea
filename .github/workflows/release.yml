# Builds the Mac app for Apple silicon and Intel and a debug Android APK, and publishes them as a GitHub release whenever
# the app's version (packages/out-to-sea/package.json) has none yet. The iOS build is a check only and never blocks it.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version packages/out-to-sea/package.json)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          # a re-run attaches the APK to a release that exists without one
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "OutToSea-android.apk"; then echo "apk=false" >> "$GITHUB_OUTPUT"; else echo "apk=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packages/out-to-sea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          bun install
          # the first Electrobun run fetches the devkit the views are built against
          mkdir -p dist && bunx electrobun build --env=stable || true
          # the runners' disk-image tool sometimes finds its volume busy; a second try clears it
          bun run app || { sleep 15; bun run app; }
          mkdir -p out
          cp "artifacts/macos-$ARCH-OutToSea.dmg" "out/OutToSea-$TAG-$ARCH.dmg"
          # what the app's updater fetches from the latest release, by these exact names
          cp artifacts/stable-macos-"$ARCH"-* out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-${{ matrix.arch }}
          path: packages/out-to-sea/out/*

  android:
    needs: version
    if: needs.version.outputs.apk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/out-to-sea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          bun install
          bun run build:views
          bunx cap sync android
          (cd android && ./gradlew assembleDebug)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/OutToSea-$TAG-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: packages/out-to-sea/out/*

  ios:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/out-to-sea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build for the Simulator
        run: |
          # built locally with Xcode 26.2; take the newest stable 26.x the image has
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_26.*.app | grep -v beta | sort -V | tail -1)"
          bun install
          bun run build:views
          bunx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dmg-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" OutToSea-*.dmg stable-macos-* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Out to Sea $TAG" \
            --notes "Download arm64 for Apple silicon, x64 for Intel. Not yet signed: see the README to open it the first time."

  publish-android:
    needs: [version, android, publish]
    if: ${{ !cancelled() && needs.android.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cp OutToSea-*-android.apk OutToSea-android.apk
          gh release upload "$TAG" OutToSea-*-android.apk OutToSea-android.apk --repo "$GITHUB_REPOSITORY" --clobber
