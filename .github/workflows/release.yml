# Builds the Mac app for Apple silicon and Intel and publishes both as a GitHub release whenever the app's version
# (packages/out-to-sea/package.json) has none yet.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version packages/out-to-sea/package.json)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packages/out-to-sea
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          bun install
          # the first Electrobun run fetches the devkit the views are built against
          mkdir -p dist && bunx electrobun build --env=stable || true
          # the runners' disk-image tool sometimes finds its volume busy; a second try clears it
          bun run app || { sleep 15; bun run app; }
          mkdir -p out
          cp "artifacts/macos-$ARCH-OutToSea.dmg" "out/OutToSea-$TAG-$ARCH.dmg"
          # what the app's updater fetches from the latest release, by these exact names
          cp artifacts/stable-macos-"$ARCH"-* out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-${{ matrix.arch }}
          path: packages/out-to-sea/out/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dmg-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" OutToSea-*.dmg stable-macos-* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Out to Sea $TAG" \
            --notes "Download arm64 for Apple silicon, x64 for Intel. Not yet signed: see the README to open it the first time."
