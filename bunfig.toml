[install]
# a newly published version waits two days before it installs; the toolchain below moves at release speed
minimumReleaseAge = 172800
minimumReleaseAgeExcludes = [
  "pinia-logger",
  "typescript",
  "@typescript/typescript-darwin-arm64",
  "@typescript/typescript-darwin-x64",
  "@typescript/typescript-linux-x64",
  "tsrs",
  "@tsrs/darwin-arm64",
  "@tsrs/darwin-x64",
  "@tsrs/linux-x64-gnu",
  "@tsrs/linux-x64-musl",
  "golar",
  "@golar/vue",
  "@golar/darwin-arm64",
  "@golar/darwin-x64",
  "@golar/linux-x64",
  "@golar/linux-x64-musl",
  "oxlint",
  "@oxlint/plugins",
  "@oxlint/binding-darwin-arm64",
  "@oxlint/binding-darwin-x64",
  "@oxlint/binding-linux-x64-gnu",
  "@oxlint/binding-linux-x64-musl",
  "oxlint-tsgolint",
  "@oxlint-tsgolint/darwin-arm64",
  "@oxlint-tsgolint/darwin-x64",
  "@oxlint-tsgolint/linux-x64",
  "oxfmt",
  "@oxfmt/binding-darwin-arm64",
  "@oxfmt/binding-darwin-x64",
  "@oxfmt/binding-linux-x64-gnu",
  "vite",
  "vite-plus",
  "@voidzero-dev/vite-plus-core",
  "@voidzero-dev/vite-plus-darwin-arm64",
  "@voidzero-dev/vite-plus-darwin-x64",
  "@voidzero-dev/vite-plus-linux-x64-gnu",
  "rolldown",
  "@rolldown/binding-darwin-arm64",
  "@rolldown/binding-darwin-x64",
  "@rolldown/binding-linux-x64-gnu",
  "@rolldown/binding-linux-x64-musl",
  "@oxc-project/types",
  "@oxc-project/runtime",
]
